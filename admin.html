<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>স্বপ্নচূড়া | Admin Panel</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#073b8f">
<style>
:root{--blue:#073b8f;--blue2:#0a5bc4;--red:#e21d2f;--green:#16a34a;--orange:#f59e0b;--dark:#0b1730;--muted:#667085;--light:#f5f8fc;--white:#fff;--border:#e5eaf2;--shadow:0 10px 30px rgba(4,25,60,.10)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--light);color:var(--dark);line-height:1.55}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
.login-page{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#073b8f,#0a5bc4)}
.login-card{width:min(430px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 25px 70px rgba(0,0,0,.25)}
.logo{width:72px;height:72px;object-fit:contain;display:block;margin:0 auto 12px;border-radius:50%}
.login-card h1{text-align:center;color:var(--blue);margin:0 0 5px}.login-card .sub{text-align:center;color:var(--muted);margin:0 0 25px}
.field{margin-bottom:15px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d6deea;border-radius:10px;padding:11px 12px;outline:none;background:#fff}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(10,91,196,.10)}
.primary{width:100%;border:0;background:var(--blue);color:#fff;padding:12px;border-radius:10px;font-weight:900}.primary:disabled{opacity:.65;cursor:not-allowed}
.error{background:#fff0f1;color:var(--red);padding:10px 12px;border-radius:9px;margin-bottom:14px;font-weight:700;font-size:14px}
.info{font-size:12px;color:var(--muted);text-align:center;margin-top:15px}
.admin{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 3px 16px rgba(0,0,0,.06)}.topin{max-width:1250px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:900;font-size:21px}.brand img{width:42px;height:42px;border-radius:50%;object-fit:contain}.userbox{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}.logout{border:0;background:#fff0f1;color:var(--red);padding:8px 12px;border-radius:9px;font-weight:800}
.main{max-width:1250px;margin:auto;padding:22px 18px 50px}.welcome{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.welcome h1{margin:0;color:var(--blue);font-size:30px}.addbtn{border:0;background:var(--red);color:#fff;padding:11px 17px;border-radius:10px;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--border);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.stat small{color:var(--muted);font-weight:700}.stat strong{display:block;font-size:27px;color:var(--blue);margin-top:3px}
.panel{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.toolbar{padding:15px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap}.search{flex:1;min-width:220px;border:1px solid #d6deea;border-radius:10px;padding:11px 13px;outline:none}.filter{border:1px solid #d6deea;border-radius:10px;padding:11px 13px;background:#fff}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:12px 13px;border-bottom:1px solid #edf1f6;text-align:left;vertical-align:middle}.table th{background:#f8fafc;color:#475467;font-size:13px}.thumb{width:55px;height:55px;object-fit:cover;border-radius:9px;background:#f4f6f8}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:900}.active{background:#eaf8ef;color:var(--green)}.inactive{background:#fff0f1;color:var(--red)}.actions{display:flex;gap:6px}.action{border:0;border-radius:8px;padding:7px 9px;font-weight:800;font-size:12px}.edit{background:#eaf2ff;color:var(--blue2)}.delete{background:#fff0f1;color:var(--red)}.toggle{background:#fff7df;color:#9a6700}
.empty{text-align:center;padding:45px;color:var(--muted)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:100;display:none;align-items:center;justify-content:center;padding:15px}.modal-overlay.show{display:flex}.modal{background:#fff;width:min(760px,100%);max-height:calc(100vh - 30px);overflow:auto;border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.3)}.modal-head{position:sticky;top:0;background:#fff;z-index:2;padding:17px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0;color:var(--blue);font-size:21px}.close{border:0;background:#eef2f7;width:36px;height:36px;border-radius:50%;font-size:22px}.form{padding:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.upload-box{border:2px dashed #cdd7e5;border-radius:13px;padding:16px;text-align:center;background:#fafcff}.upload-box input{width:100%}.preview{width:150px;height:150px;object-fit:contain;border-radius:12px;border:1px solid var(--border);background:#f7f9fc;margin:12px auto;display:block}.progress{height:8px;background:#edf1f6;border-radius:99px;overflow:hidden;margin-top:10px}.progress>div{height:100%;width:0;background:var(--blue2);transition:.2s}.modal-actions{display:flex;gap:10px;margin-top:18px}.modal-actions button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:900}.save{background:var(--blue);color:#fff}.cancel{background:#eef2f7;color:var(--dark)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#0b1730;color:#fff;padding:11px 17px;border-radius:999px;z-index:300;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--red)}
.note{font-size:12px;color:var(--muted);margin-top:5px}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.userbox span{display:none}}
@media(max-width:620px){.topin{padding:10px 12px}.main{padding:16px 12px 40px}.welcome{align-items:flex-start;flex-direction:column}.welcome h1{font-size:25px}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.form{padding:15px}}
</style>
</head>
<body>

<div id="loginPage" class="login-page">
  <div class="login-card">
    <img src="logo.png" class="logo" alt="স্বপ্নচূড়া">
    <h1>স্বপ্নচূড়া Admin</h1>
    <p class="sub">নিরাপদ Admin Login</p>
    <div id="loginError" class="error hidden"></div>
    <form id="loginForm">
      <div class="field"><label for="loginEmail">Admin Email</label><input id="loginEmail" type="email" value="mdrazibulislam240@gmail.com" autocomplete="username" required></div>
      <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" placeholder="আপনার Firebase Auth Password" autocomplete="current-password" required></div>
      <button id="loginBtn" class="primary" type="submit">🔐 Login</button>
    </form>
    <div class="info">শুধুমাত্র অনুমোদিত Admin account ব্যবহার করুন।</div>
  </div>
</div>

<div id="adminPage" class="admin hidden">
  <header class="topbar"><div class="topin">
    <a class="brand" href="#" onclick="return false"><img src="logo.png" alt="">স্বপ্নচূড়া Admin</a>
    <div class="userbox"><span id="adminEmail"></span><button class="logout" onclick="logout()">Logout</button></div>
  </div></header>

  <main class="main">
    <div class="welcome"><div><h1>📊 Dashboard</h1><div class="note">পণ্য পরিচালনা ও স্টক নিয়ন্ত্রণ</div></div><button class="addbtn" onclick="openAddModal()">＋ নতুন পণ্য</button></div>

    <div class="stats">
      <div class="stat"><small>মোট পণ্য</small><strong id="totalProducts">০</strong></div>
      <div class="stat"><small>Active</small><strong id="activeProducts">০</strong></div>
      <div class="stat"><small>Inactive</small><strong id="inactiveProducts">০</strong></div>
      <div class="stat"><small>স্টকে আছে</small><strong id="inStockProducts">০</strong></div>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input id="searchInput" class="search" type="search" placeholder="🔎 পণ্যের নাম / Code দিয়ে খুঁজুন..." oninput="renderTable()">
        <select id="statusFilter" class="filter" onchange="renderTable()"><option value="all">সব Status</option><option value="active">Active</option><option value="inactive">Inactive</option></select>
        <select id="categoryFilter" class="filter" onchange="renderTable()"><option value="all">সব Category</option></select>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>ছবি</th><th>পণ্য</th><th>Code</th><th>মূল দাম</th><th>বিক্রয় দাম</th><th>Stock</th><th>Status</th><th>Order</th><th>Action</th></tr></thead>
          <tbody id="productTable"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div id="modalOverlay" class="modal-overlay" onclick="modalOutside(event)">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">নতুন পণ্য</h2><button class="close" onclick="closeModal()">×</button></div>
    <form id="productForm" class="form">
      <input type="hidden" id="productId">
      <input type="hidden" id="oldImageUrl">
      <div class="two">
        <div class="field"><label>পণ্যের নাম *</label><input id="name" required></div>
        <div class="field"><label>Product Code</label><input id="code"></div>
      </div>
      <div class="two">
        <div class="field"><label>মূল দাম (৳) *</label><input id="originalPrice" type="number" min="0" step="0.01" required></div>
        <div class="field"><label>বিক্রয় দাম (৳) *</label><input id="salePrice" type="number" min="0" step="0.01" required></div>
      </div>
      <div class="two">
        <div class="field"><label>Stock *</label><input id="stock" type="number" min="0" step="1" value="0" required></div>
        <div class="field"><label>Display Order</label><input id="displayOrder" type="number" min="0" step="1" value="0"></div>
      </div>
      <div class="two">
        <div class="field"><label>Category</label><input id="category" placeholder="যেমন: TV, Fridge, Furniture"></div>
        <div class="field"><label>Status</label><select id="active"><option value="true">Active — Website-এ দেখাবে</option><option value="false">Inactive — Website-এ দেখাবে না</option></select></div>
      </div>
      <div class="field"><label>Description</label><textarea id="description" rows="3" placeholder="পণ্যের সংক্ষিপ্ত বিবরণ"></textarea></div>

      <div class="field">
        <label>Product Image</label>
        <div class="upload-box">
          <input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
          <img id="imagePreview" class="preview" src="logo.png" alt="Preview">
          <div id="uploadStatus" class="note">JPG, PNG, WEBP বা GIF • সর্বোচ্চ 5MB</div>
          <div id="progressBox" class="progress hidden"><div id="progressBar"></div></div>
        </div>
      </div>

      <div class="modal-actions"><button class="cancel" type="button" onclick="closeModal()">বাতিল</button><button id="saveBtn" class="save" type="submit">💾 সংরক্ষণ করুন</button></div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc,
  doc, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import {
  getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyD0n0aftfePcUB2YxGKxCl9Gl94FRu3558",
  authDomain: "swapnochura-e90b8.firebaseapp.com",
  projectId: "swapnochura-e90b8",
  storageBucket: "swapnochura-e90b8.firebasestorage.app",
  messagingSenderId: "1065728831941",
  appId: "1:1065728831941:web:367c37eb72c13cc723dbac",
  measurementId: "G-8ZG18K4CPT"
};

const ADMIN_EMAIL = "mdrazibulislam240@gmail.com";
const MAX_IMAGE_SIZE = 5 * 1024 * 1024;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let allProducts = [];
let editingProduct = null;

const $ = id => document.getElementById(id);
const bn = n => Number(n || 0).toLocaleString("bn-BD");
const money = n => "৳" + bn(n);
const imageOf = p => p.imageUrl || p.image || "logo.png";

function showToast(msg, bad=false){
  const t=$("toast"); t.textContent=msg; t.className="toast show"+(bad?" bad":"");
  clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.className="toast",2200);
}
function showLoginError(msg){$("loginError").textContent=msg;$("loginError").classList.remove("hidden");}
function clearLoginError(){$("loginError").classList.add("hidden");}

$("loginForm").addEventListener("submit", async e=>{
  e.preventDefault(); clearLoginError();
  const email=$("loginEmail").value.trim().toLowerCase();
  const password=$("loginPassword").value;
  if(email!==ADMIN_EMAIL){showLoginError("এই Email অনুমোদিত Admin Email নয়।");return;}
  $("loginBtn").disabled=true;$("loginBtn").textContent="Login হচ্ছে...";
  try{await signInWithEmailAndPassword(auth,email,password);}
  catch(err){
    console.error(err);
    const map={
      "auth/invalid-credential":"Email অথবা Password সঠিক নয়।",
      "auth/user-not-found":"এই Email দিয়ে Firebase Authentication account পাওয়া যায়নি।",
      "auth/wrong-password":"Password সঠিক নয়।",
      "auth/too-many-requests":"অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।"
    };
    showLoginError(map[err.code] || "Login করা যায়নি: "+err.message);
  }finally{$("loginBtn").disabled=false;$("loginBtn").textContent="🔐 Login";}
});

onAuthStateChanged(auth, async user=>{
  if(user && user.email && user.email.toLowerCase()===ADMIN_EMAIL){
    $("loginPage").classList.add("hidden");$("adminPage").classList.remove("hidden");
    $("adminEmail").textContent=user.email; await loadProducts();
  }else{
    if(user) await signOut(auth);
    $("loginPage").classList.remove("hidden");$("adminPage").classList.add("hidden");
  }
});

window.logout=async()=>{await signOut(auth);};

async function loadProducts(){
  $("productTable").innerHTML='<tr><td colspan="9" class="empty">পণ্য লোড হচ্ছে...</td></tr>';
  try{
    const snap=await getDocs(query(collection(db,"products"),orderBy("displayOrder","asc")));
    allProducts=snap.docs.map(d=>({id:d.id,...d.data()}));
    allProducts.sort((a,b)=>(Number(a.displayOrder??999999)-Number(b.displayOrder??999999))||String(a.name||"").localeCompare(String(b.name||"")));
    updateStats();updateCategoryFilter();renderTable();
  }catch(err){
    console.error(err);
    $("productTable").innerHTML='<tr><td colspan="9" class="empty">পণ্য লোড করা যায়নি। Firestore Rules বা index পরীক্ষা করুন।</td></tr>';
    showToast("পণ্য লোড করা যায়নি",true);
  }
}

function updateStats(){
  $("totalProducts").textContent=bn(allProducts.length);
  $("activeProducts").textContent=bn(allProducts.filter(p=>p.active===true).length);
  $("inactiveProducts").textContent=bn(allProducts.filter(p=>p.active!==true).length);
  $("inStockProducts").textContent=bn(allProducts.filter(p=>Number(p.stock||0)>0).length);
}
function updateCategoryFilter(){
  const select=$("categoryFilter"), old=select.value;
  const cats=[...new Set(allProducts.map(p=>String(p.category||"").trim()).filter(Boolean))].sort();
  select.innerHTML='<option value="all">সব Category</option>'+cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  if(cats.includes(old))select.value=old;
}
function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function renderTable(){
  const q=$("searchInput").value.trim().toLowerCase(), status=$("statusFilter").value, cat=$("categoryFilter").value;
  const list=allProducts.filter(p=>{
    const text=(String(p.name||"")+" "+String(p.code||"")+" "+String(p.category||"")).toLowerCase();
    return (!q||text.includes(q))&&(status==="all"||(status==="active"?p.active===true:p.active!==true))&&(cat==="all"||String(p.category||"")===cat);
  });
  if(!list.length){$("productTable").innerHTML='<tr><td colspan="9" class="empty">কোনো পণ্য পাওয়া যায়নি।</td></tr>';return;}
  $("productTable").innerHTML=list.map(p=>{
    const original=Number(p.originalPrice??p.original??0), sale=Number(p.salePrice??p.sale??0);
    return `<tr>
      <td><img class="thumb" src="${escapeHtml(imageOf(p))}" alt=""></td>
      <td><strong>${escapeHtml(p.name||"—")}</strong><div class="note">${escapeHtml(p.category||"")}</div></td>
      <td>${escapeHtml(p.code||"—")}</td>
      <td>${money(original)}</td><td><strong>${money(sale)}</strong></td>
      <td>${bn(p.stock)}</td>
      <td><span class="badge ${p.active===true?"active":"inactive"}">${p.active===true?"Active":"Inactive"}</span></td>
      <td>${bn(p.displayOrder)}</td>
      <td><div class="actions">
        <button class="action edit" onclick="editProduct('${p.id}')">✏️ Edit</button>
        <button class="action toggle" onclick="toggleProduct('${p.id}')">${p.active===true?"⏸ Off":"▶ On"}</button>
        <button class="action delete" onclick="deleteProduct('${p.id}')">🗑️ Delete</button>
      </div></td>
    </tr>`;
  }).join("");
}

$("imageFile").addEventListener("change",()=>{
  const file=$("imageFile").files[0]; if(!file)return;
  if(file.size>MAX_IMAGE_SIZE){showToast("ছবির সাইজ সর্বোচ্চ 5MB হতে হবে",true);$("imageFile").value="";return;}
  if(!file.type.startsWith("image/")){showToast("শুধু image file নির্বাচন করুন",true);$("imageFile").value="";return;}
  $("imagePreview").src=URL.createObjectURL(file);$("uploadStatus").textContent=file.name+" নির্বাচিত হয়েছে";
});

window.openAddModal=()=>{
  editingProduct=null;$("modalTitle").textContent="নতুন পণ্য যোগ করুন";$("productForm").reset();
  $("productId").value="";$("oldImageUrl").value="";$("active").value="true";$("stock").value="0";$("displayOrder").value=String(allProducts.length+1);
  $("imagePreview").src="logo.png";$("uploadStatus").textContent="ছবি নির্বাচন করুন";
  $("modalOverlay").classList.add("show");
};
window.editProduct=id=>{
  const p=allProducts.find(x=>x.id===id);if(!p)return;
  editingProduct=p;$("modalTitle").textContent="পণ্য Edit করুন";
  $("productId").value=p.id;$("oldImageUrl").value=p.imageUrl||"";
  $("name").value=p.name||"";$("code").value=p.code||"";$("originalPrice").value=p.originalPrice??p.original??0;$("salePrice").value=p.salePrice??p.sale??0;
  $("stock").value=p.stock??0;$("displayOrder").value=p.displayOrder??0;$("category").value=p.category||"";$("active").value=p.active===true?"true":"false";$("description").value=p.description||"";
  $("imageFile").value="";$("imagePreview").src=imageOf(p);$("uploadStatus").textContent=p.imageUrl?"বর্তমান ছবি ব্যবহার হচ্ছে":"ছবি নেই";
  $("modalOverlay").classList.add("show");
};
window.closeModal=()=>{$("modalOverlay").classList.remove("show");editingProduct=null;};
window.modalOutside=e=>{if(e.target.id==="modalOverlay")window.closeModal();};

async function uploadImage(file, productId){
  const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path=`products/${productId}/${Date.now()}_${safe}`;
  const storageRef=ref(storage,path);
  const task=uploadBytesResumable(storageRef,file,{contentType:file.type,cacheControl:"public,max-age=31536000"});
  $("progressBox").classList.remove("hidden");
  return new Promise((resolve,reject)=>{
    task.on("state_changed",
      snap=>{$("progressBar").style.width=((snap.bytesTransferred/snap.totalBytes)*100)+"%";$("uploadStatus").textContent="ছবি Upload হচ্ছে... "+Math.round(snap.bytesTransferred/snap.totalBytes*100)+"%";},
      err=>reject(err),
      async()=>{try{resolve(await getDownloadURL(task.snapshot.ref));}catch(e){reject(e);}}
    );
  });
}

$("productForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("name").value.trim(), code=$("code").value.trim();
  const originalPrice=Number($("originalPrice").value),salePrice=Number($("salePrice").value),stock=Math.max(0,Number($("stock").value)||0),displayOrder=Math.max(0,Number($("displayOrder").value)||0);
  if(!name||!Number.isFinite(originalPrice)||!Number.isFinite(salePrice)){showToast("পণ্যের নাম ও দাম সঠিকভাবে দিন",true);return;}
  if(salePrice>originalPrice){if(!confirm("বিক্রয় দাম মূল দামের চেয়ে বেশি। তবুও সংরক্ষণ করবেন?"))return;}
  const data={name,code,originalPrice,salePrice,stock,displayOrder,category:$("category").value.trim(),active:$("active").value==="true",description:$("description").value.trim(),updatedAt:serverTimestamp()};
  $("saveBtn").disabled=true;$("saveBtn").textContent="সংরক্ষণ হচ্ছে...";
  try{
    let id=$("productId").value, imageUrl=$("oldImageUrl").value.trim();
    if(!id){
      const newDoc=await addDoc(collection(db,"products"),{...data,createdAt:serverTimestamp()});id=newDoc.id;
    }else{
      await updateDoc(doc(db,"products",id),data);
    }
    const file=$("imageFile").files[0];
    if(file){
      const newUrl=await uploadImage(file,id);
      const oldUrl=imageUrl;
      await updateDoc(doc(db,"products",id),{imageUrl:newUrl,updatedAt:serverTimestamp()});
      if(oldUrl && oldUrl!==newUrl){try{await deleteObject(ref(storage,oldUrl));}catch(e){console.warn("Old image delete skipped:",e);}}
    }else if(!id){
      await updateDoc(doc(db,"products",id),{imageUrl:"logo.png"});
    }
    window.closeModal();await loadProducts();showToast(editingProduct?"পণ্য আপডেট হয়েছে":"নতুন পণ্য যোগ হয়েছে");
  }catch(err){
    console.error(err);showToast("সংরক্ষণ করা যায়নি: "+err.message,true);
  }finally{$("saveBtn").disabled=false;$("saveBtn").textContent="💾 সংরক্ষণ করুন";$("progressBox").classList.add("hidden");$("progressBar").style.width="0";}
});

window.toggleProduct=async id=>{
  const p=allProducts.find(x=>x.id===id);if(!p)return;
  try{await updateDoc(doc(db,"products",id),{active:p.active!==true,updatedAt:serverTimestamp()});await loadProducts();showToast(p.active===true?"পণ্য Inactive করা হয়েছে":"পণ্য Active করা হয়েছে");}
  catch(e){console.error(e);showToast("Status পরিবর্তন করা যায়নি",true);}
};

function storagePathFromUrl(url){
  try{
    const u=new URL(url); const marker="/o/"; const i=u.pathname.indexOf(marker);
    if(i<0)return null; return decodeURIComponent(u.pathname.slice(i+marker.length));
  }catch(e){return null;}
}
window.deleteProduct=async id=>{
  const p=allProducts.find(x=>x.id===id);if(!p)return;
  if(!confirm(`"${p.name||"এই পণ্য"}" Delete করবেন?`))return;
  try{
    await deleteDoc(doc(db,"products",id));
    if(p.imageUrl){try{await deleteObject(ref(storage,p.imageUrl));}catch(e){
      const path=storagePathFromUrl(p.imageUrl);if(path){try{await deleteObject(ref(storage,path));}catch(_){console.warn("Storage image delete skipped");}}
    }}
    await loadProducts();showToast("পণ্য Delete হয়েছে");
  }catch(e){console.error(e);showToast("Delete করা যায়নি: "+e.message,true);}
};
</script>
